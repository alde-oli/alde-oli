<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170" role="img">
<style>
@font-face{font-family:Y;font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:Y;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:Y,'Noto Sans',Helvetica,sans-serif;fill:#454138}
.l{font-weight:300} .m{font-weight:500} .inv{fill:#dcd8c0} .mut{fill:#7d7766}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h))}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.scan{animation:none}}

</style>
